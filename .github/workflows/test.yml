# Without Nix, on every push and pull request: Elixir and Erlang/OTP from setup-beam, as a person installs
# them. It compiles with warnings as errors, builds the release and runs citl's commands that need no wall
# (help, read, status, start / stop, log). The acceptance (bin/test) needs forbidden, zoozve and user
# namespaces: it is run on a machine, not here. The `upstream` job says when sync/UPSTREAM_TREE is not
# Citlalpol's main (a notice, not a failure).
name: test
on:
  push:
  pull_request:
jobs:
  citl:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { elixir: "1.18.4", otp: "27" }
          - { elixir: "1.19", otp: "28" }
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix compile --warnings-as-errors
      - run: bin/release
      - name: citl without a wall
        run: |
          export CITLALPOL_CONFIG="$RUNNER_TEMP/config" CITLALPOL_STATE="$RUNNER_TEMP/state" CITLALPOL_RUNTIME="$RUNNER_TEMP/run"
          bin/citl help
          mkdir -p "$RUNNER_TEMP/p" && echo '{"destinations":[{"host":"example.com","do":"pass"}]}' > "$RUNNER_TEMP/p/access.json"
          bin/citl read "$RUNNER_TEMP/p/access.json" p
          bin/citl status | grep -q "^   p "
          bin/citl start && bin/citl status | grep -q running && bin/citl stop
          bin/citl log
  upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --quiet --depth 1 --filter=blob:none https://github.com/Crux-xurC/Citlalpol.git /tmp/upstream || { echo "::notice::Citlalpol is not reachable (private?)"; exit 0; }
          main=$(git -C /tmp/upstream rev-parse 'HEAD^{tree}')
          if [ "$main" = "$(cat sync/UPSTREAM_TREE)" ]; then echo "in step with Citlalpol's main"
          else echo "::notice::not in step with Citlalpol's main (sync/UPSTREAM_TREE $(cat sync/UPSTREAM_TREE), main's tree $main): sync/sync.sh"; fi
